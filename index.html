<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#231b5c">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%8E%A2%3C/text%3E%3C/svg%3E">
<title>שוסטר פארק</title>
<meta name="description" content="בונים רכבות הרים, מנהלים תקציב, מתמחרים כרטיסים ושומרים על המבקרים מרוצים. פארק שעשועים שלם בדפדפן.">
<meta property="og:type" content="website">
<meta property="og:title" content="שוסטר פארק — בונים לונה פארק">
<meta property="og:description" content="רכבות הרים, מתקנים, דוכנים, עובדים ותקציב. בלי הורדה, ישר בדפדפן.">
<meta property="og:image" content="./og.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Rubik:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  /* Luna park at dusk: a deep night-purple dock and panels lit by candy colours. */
  :root {
    --night: #231b5c; --night2: #3a2a8c; --ink: #241f3d; --dim: #6a6585; --paper: #fffaf2; --card: #ffffff; --line: rgba(35, 27, 92, 0.1);
    --red: #ef3b4a; --pink: #ff4f8b; --orange: #ff8a3d; --yellow: #ffc93c; --teal: #19c3a3; --blue: #2b8cff; --purple: #8f5fd8; --green: #22b05e; --bad: #e0344a;
    --display: 'Fredoka', 'Rubik', system-ui, -apple-system, sans-serif;
    --font: 'Rubik', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif;
    --top: max(8px, env(safe-area-inset-top)); --bot: max(8px, env(safe-area-inset-bottom));
    --stripes: repeating-linear-gradient(90deg, var(--red) 0 22px, #fff 22px 44px);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fd7ff; color: var(--ink); font-family: var(--font); user-select: none; -webkit-user-select: none; touch-action: none; overscroll-behavior: none; }
  canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; }
  .hidden { display: none !important; }
  button { font-family: inherit; cursor: pointer; border: 0; color: inherit; background: none; padding: 0; }
  button:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  .num { direction: ltr; unicode-bidi: isolate; font-variant-numeric: tabular-nums; }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* ---------- top bar: money, guests, rating; date and speed ---------- */
  #top { position: fixed; top: var(--top); left: 8px; right: 8px; display: flex; flex-direction: column; gap: 6px; z-index: 20; pointer-events: none; }
  #top .grp { display: flex; gap: 6px; align-items: center; }
  .chip { pointer-events: auto; display: flex; align-items: center; gap: 7px; height: 38px; padding: 0 12px 0 5px; border-radius: 19px; background: var(--paper); box-shadow: 0 3px 0 rgba(35, 27, 92, 0.18), 0 6px 16px rgba(0, 0, 0, 0.12); font-family: var(--display); font-weight: 700; font-size: 17px; white-space: nowrap; color: var(--night); }
  .chip .ic { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 15px; }
  #c-cash .ic { background: linear-gradient(145deg, #4ade80, var(--green)); }
  #c-guests .ic { background: linear-gradient(145deg, #7cc0ff, var(--blue)); }
  #c-rating .ic { background: linear-gradient(145deg, #ffe08a, var(--yellow)); }
  #c-date .ic { background: linear-gradient(145deg, #ff9dbe, var(--pink)); }
  .chip.neg { color: var(--bad); }
  #date { font-family: var(--font); font-weight: 500; font-size: 13px; color: var(--dim); }
  #speed { padding: 0 3px; gap: 2px; }
  #speed button { min-width: 36px; height: 32px; padding: 0 6px; border-radius: 16px; font-size: 12px; font-weight: 800; color: var(--dim); letter-spacing: -2px; direction: ltr; transition: background 0.15s; }
  #speed button.on { background: linear-gradient(145deg, var(--night2), var(--night)); color: var(--yellow); box-shadow: 0 0 0 2px rgba(255, 201, 60, 0.35); }

  /* the goal under the bar, once the park is open */
  #hint { position: fixed; top: calc(var(--top) + 90px); right: 8px; max-width: min(460px, calc(100% - 16px)); z-index: 19; display: flex; align-items: center; gap: 8px; padding: 6px 12px 6px 6px; border-radius: 18px; background: rgba(35, 27, 92, 0.88); color: #fff; font-size: 13px; line-height: 1.3; box-shadow: 0 4px 14px rgba(0, 0, 0, 0.2); pointer-events: auto; backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #hint b { color: var(--yellow); font-family: var(--display); font-size: 14px; }
  #hint .gl { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--pink); font-size: 14px; flex: 0 0 auto; }
  #hint .bar { width: 46px; height: 6px; border-radius: 3px; background: rgba(255, 255, 255, 0.2); overflow: hidden; display: inline-block; vertical-align: middle; }
  #hint .bar i { display: block; height: 100%; background: var(--yellow); border-radius: 3px; }

  /* ---------- the tutorial: three short steps ---------- */
  #tut { position: fixed; top: calc(var(--top) + 90px); left: 50%; transform: translateX(-50%); width: min(420px, calc(100% - 16px)); z-index: 22; background: var(--paper); border-radius: 22px; overflow: hidden; box-shadow: 0 4px 0 rgba(35, 27, 92, 0.2), 0 16px 40px rgba(0, 0, 0, 0.25); animation: pop 0.35s cubic-bezier(.2, 1.4, .4, 1); }
  #tut .awn { height: 12px; background: var(--stripes); }
  #tut .in { display: flex; gap: 12px; align-items: center; padding: 12px 14px 12px; }
  #tut .big { width: 52px; height: 52px; flex: 0 0 auto; border-radius: 16px; display: grid; place-items: center; font-size: 28px; background: linear-gradient(145deg, var(--yellow), var(--orange)); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12); }
  #tut .tx { flex: 1; min-width: 0; }
  #tut .st { font-size: 11.5px; font-weight: 700; color: var(--pink); letter-spacing: 0.4px; }
  #tut h3 { margin: 1px 0 2px; font-family: var(--display); font-size: 19px; color: var(--night); font-weight: 700; }
  #tut p { margin: 0; font-size: 13.5px; color: var(--dim); line-height: 1.35; }
  #tut .row2 { display: flex; gap: 8px; align-items: center; padding: 0 14px 12px; }
  #tut .skip { font-size: 13px; color: var(--dim); text-decoration: underline; padding: 8px 4px; }
  #tut .dots { display: flex; gap: 5px; margin-inline-start: auto; }
  #tut .dots i { width: 8px; height: 8px; border-radius: 50%; background: var(--line); }
  #tut .dots i.on { background: var(--pink); width: 20px; border-radius: 4px; }
  @keyframes pop { from { opacity: 0; transform: translate(-50%, -10px) scale(0.96); } }

  /* ---------- toasts ---------- */
  #toasts { position: fixed; top: calc(var(--top) + 134px); left: 50%; transform: translateX(-50%); width: min(420px, calc(100% - 24px)); display: flex; flex-direction: column; gap: 6px; z-index: 40; pointer-events: none; }
  .toast { pointer-events: auto; display: flex; align-items: center; gap: 10px; padding: 9px 14px 9px 10px; border-radius: 18px; background: rgba(35, 27, 92, 0.94); color: #fff; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.25); font-size: 14px; font-weight: 500; line-height: 1.35; animation: tin 0.3s cubic-bezier(.2, 1.3, .4, 1); }
  .toast::before { content: '🎪'; width: 26px; height: 26px; flex: 0 0 auto; border-radius: 50%; display: grid; place-items: center; font-size: 14px; background: var(--blue); }
  .toast.bad::before { content: '⚠️'; background: var(--red); } .toast.good::before { content: '✨'; background: var(--green); } .toast.warn::before { content: '💡'; background: var(--orange); }
  @keyframes tin { from { opacity: 0; transform: translateY(-10px) scale(0.97); } }

  /* ---------- the dock ---------- */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; pointer-events: none; padding: 0 8px var(--bot); }
  #dock { pointer-events: auto; margin: 0 auto; max-width: 1000px; border-radius: 26px; background: linear-gradient(180deg, var(--night2), var(--night)); box-shadow: 0 4px 0 #160f40, 0 14px 34px rgba(20, 10, 60, 0.45); position: relative; overflow: hidden; }
  #dock::before { content: ''; position: absolute; inset: 0 0 auto; height: 5px; background: var(--stripes); opacity: 0.9; }
  #tools { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; padding: 10px 6px 6px; touch-action: pan-x; }
  #tools::-webkit-scrollbar { display: none; }
  .tool { flex: 0 0 auto; width: 64px; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 2px 0 2px; font-family: var(--display); font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.86); transition: transform 0.15s; }
  .tool .ic { width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; font-size: 23px; background: linear-gradient(145deg, var(--c1), var(--c2)); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18), 0 3px 8px rgba(0, 0, 0, 0.3); transition: transform 0.15s, box-shadow 0.15s; }
  .tool:active .ic { transform: scale(0.92); }
  .tool.on { color: var(--yellow); }
  .tool.on .ic { transform: translateY(-3px) scale(1.06); box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18), 0 0 0 3px #fff, 0 0 18px var(--c1); }
  .tool.pulse .ic { animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 50% { box-shadow: inset 0 -4px 0 rgba(0, 0, 0, 0.18), 0 0 0 5px var(--yellow), 0 0 22px var(--yellow); transform: scale(1.08); } }

  /* ---------- the sheet: a little striped awning on top ---------- */
  #sheet { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bot) + 96px); width: min(560px, calc(100% - 12px)); max-height: min(60vh, 560px); z-index: 30; background: var(--paper); border-radius: 24px; box-shadow: 0 4px 0 rgba(35, 27, 92, 0.2), 0 18px 46px rgba(0, 0, 0, 0.3); display: flex; flex-direction: column; overflow: hidden; animation: sin 0.25s cubic-bezier(.2, 1.2, .4, 1); }
  @keyframes sin { from { opacity: 0; transform: translate(-50%, 18px); } }
  #sheet.wide { max-height: min(72vh, 680px); }
  #sheet::before { content: ''; flex: 0 0 auto; height: 12px; background: var(--stripes); }
  .sh-head { display: flex; align-items: center; gap: 10px; padding: 10px 16px 8px; }
  .sh-title { flex: 1; font-family: var(--display); font-size: 22px; font-weight: 700; color: var(--night); min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .x { width: 36px; height: 36px; border-radius: 50%; background: rgba(35, 27, 92, 0.08); font-size: 16px; font-weight: 800; color: var(--night); flex: 0 0 auto; }
  .sh-body { overflow-y: auto; padding: 2px 16px 16px; -webkit-overflow-scrolling: touch; touch-action: pan-y; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(152px, 1fr)); gap: 10px; }
  .card { position: relative; text-align: right; padding: 12px; border-radius: 18px; background: var(--card); box-shadow: 0 2px 0 var(--line), 0 0 0 1.5px var(--line); display: flex; flex-direction: column; gap: 4px; transition: transform 0.12s; }
  .card:active { transform: scale(0.97); }
  .card.off { opacity: 0.45; }
  .card .ic { width: 50px; height: 50px; border-radius: 16px; display: grid; place-items: center; font-size: 28px; background: linear-gradient(145deg, var(--c1, #ffe08a), var(--c2, var(--yellow))); box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12); margin-bottom: 2px; }
  .card .nm { font-family: var(--display); font-weight: 700; font-size: 16.5px; color: var(--night); }
  .card .pr { align-self: flex-start; font-weight: 800; font-size: 13.5px; color: var(--night); background: var(--yellow); padding: 3px 12px; border-radius: 6px; -webkit-mask: radial-gradient(circle at 0 50%, transparent 5px, #000 5.5px) 0 0 / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 5px, #000 5.5px) 100% 0 / 51% 100% no-repeat; }
  .card .ds { font-size: 12.5px; color: var(--dim); line-height: 1.35; }
  .card .st { font-size: 11.5px; color: var(--dim); font-weight: 500; }

  .row { display: flex; align-items: center; gap: 8px; padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14.5px; }
  .row:last-child { border-bottom: 0; }
  .row .k { flex: 1; color: var(--dim); min-width: 0; }
  .row .v { font-weight: 700; }
  .sec { font-family: var(--display); font-size: 15px; font-weight: 700; color: var(--purple); margin: 14px 0 4px; }
  .pill { display: inline-block; padding: 3px 11px; border-radius: 12px; font-size: 12.5px; font-weight: 700; background: #dcfce7; color: #15803d; }
  .pill.bad { background: #ffe4e8; color: var(--bad); } .pill.mid { background: #fff1cc; color: #b45309; } .pill.gray { background: #eeecf5; color: var(--dim); }
  .btns { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
  .btn { flex: 1 1 auto; min-height: 46px; padding: 0 16px; border-radius: 23px; font-family: var(--display); font-size: 16px; font-weight: 600; background: rgba(35, 27, 92, 0.08); color: var(--night); box-shadow: inset 0 -3px 0 rgba(35, 27, 92, 0.08); transition: transform 0.1s; }
  .btn:active { transform: translateY(2px); }
  .btn.main { background: linear-gradient(145deg, var(--night2), var(--night)); color: #fff; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.3); }
  .btn.go { background: linear-gradient(145deg, #3ad17d, var(--green)); color: #fff; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18); }
  .btn.fun { background: linear-gradient(145deg, var(--pink), var(--red)); color: #fff; box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.18); }
  .btn.danger { background: #ffe4e8; color: var(--bad); }
  .btn:disabled { opacity: 0.4; }
  .stepper { display: flex; align-items: center; gap: 6px; }
  .stepper button { width: 40px; height: 40px; border-radius: 50%; background: linear-gradient(145deg, #fff, #efe9ff); box-shadow: 0 0 0 1.5px var(--line), inset 0 -2px 0 rgba(35, 27, 92, 0.08); font-size: 22px; font-weight: 800; color: var(--purple); }
  .stepper .val { min-width: 66px; text-align: center; font-family: var(--display); font-size: 20px; font-weight: 700; color: var(--night); }
  .meter { height: 9px; border-radius: 5px; background: #ece8f6; overflow: hidden; flex: 1; max-width: 150px; }
  .meter i { display: block; height: 100%; border-radius: 5px; background: linear-gradient(90deg, var(--teal), #4fe0bd); }
  .meter.warn i { background: linear-gradient(90deg, var(--orange), var(--yellow)); } .meter.bad i { background: linear-gradient(90deg, var(--red), var(--pink)); }
  .thought { font-size: 14px; padding: 5px 0; display: flex; gap: 8px; align-items: baseline; }
  .thought .n { font-weight: 800; color: var(--night); min-width: 24px; text-align: center; }
  .thought.good { color: #15803d; } .thought.bad { color: #c0263a; }
  .bars { display: flex; align-items: flex-end; gap: 4px; height: 90px; padding: 6px 0; direction: ltr; }
  .bars div { flex: 1; border-radius: 4px 4px 1px 1px; min-height: 2px; }
  .note { font-size: 13px; color: var(--dim); line-height: 1.45; }
  .price-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); }
  .price-row .pi { width: 38px; height: 38px; border-radius: 12px; display: grid; place-items: center; font-size: 20px; background: linear-gradient(145deg, #fff3cf, #ffe08a); flex: 0 0 auto; }
  .price-row .pn { flex: 1; min-width: 0; font-weight: 700; color: var(--night); font-size: 14.5px; }
  .price-row .pn small { display: block; font-weight: 500; color: var(--dim); font-size: 12px; }
  .price-row .pn small.hot { color: var(--bad); }
  .ticket-hero { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 18px; background: linear-gradient(145deg, #fff3cf, #ffe08a); margin-bottom: 6px; }
  .ticket-hero .tk { font-size: 34px; }
  .ticket-hero .k { flex: 1; font-weight: 700; color: var(--night); }
  .ticket-hero .k small { display: block; font-weight: 500; color: #7a5a10; font-size: 12.5px; }

  /* ---------- build bar (place / confirm) ---------- */
  #act { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--bot) + 100px); z-index: 25; display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; align-items: center; padding: 8px; border-radius: 26px; background: var(--paper); box-shadow: 0 4px 0 rgba(35, 27, 92, 0.2), 0 12px 30px rgba(0, 0, 0, 0.25); width: max-content; max-width: calc(100% - 16px); }
  #act .lbl { flex: 1 1 auto; padding: 2px 8px; font-size: 13.5px; font-weight: 700; color: var(--night); line-height: 1.3; text-align: center; }
  #act .btn { min-height: 44px; flex: 0 0 auto; padding: 0 18px; }
  #act .btn.x2 { width: 44px; padding: 0; }

  /* ---------- coaster builder ---------- */
  #coaster { position: fixed; left: 0; right: 0; bottom: 0; z-index: 26; padding: 0 8px var(--bot); background: linear-gradient(180deg, var(--night2), var(--night)); border-radius: 24px 24px 0 0; box-shadow: 0 -8px 30px rgba(0, 0, 0, 0.3); overflow: hidden; }
  #coaster::before { content: ''; display: block; height: 6px; margin: 0 -8px 8px; background: var(--stripes); }
  .cb-info { display: flex; gap: 10px; align-items: center; font-size: 13.5px; color: rgba(255, 255, 255, 0.75); padding: 0 4px 8px; flex-wrap: wrap; max-width: 640px; margin: 0 auto; }
  .cb-info b { color: #fff; font-family: var(--display); font-size: 16px; }
  .cb-pieces { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; max-width: 640px; margin: 0 auto; }
  .pc { height: 60px; border-radius: 16px; background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 0 1.5px rgba(255, 255, 255, 0.12); display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: var(--display); font-size: 12px; font-weight: 600; color: #fff; gap: 1px; }
  .pc:active { background: rgba(255, 255, 255, 0.2); }
  .pc .ic { font-size: 21px; line-height: 1.05; }
  .pc .pr { font-size: 10.5px; color: var(--yellow); font-family: var(--font); }
  .pc.no { opacity: 0.3; }
  .cb-act { display: flex; gap: 6px; margin: 8px auto 4px; max-width: 640px; }
  .cb-act .btn { min-height: 46px; font-size: 14.5px; padding: 0 8px; background: rgba(255, 255, 255, 0.12); color: #fff; box-shadow: none; }
  .cb-act .btn.go { background: linear-gradient(145deg, #3ad17d, var(--green)); }
  .cb-act .btn.main { background: linear-gradient(145deg, var(--yellow), var(--orange)); color: var(--night); }

  /* ---------- screens ---------- */
  .screen { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center; padding: 20px; background: radial-gradient(ellipse at 50% 30%, rgba(143, 95, 216, 0.55), rgba(35, 27, 92, 0.88)); }
  .box { position: relative; width: min(400px, 100%); background: var(--paper); border-radius: 28px; padding: 28px 22px 22px; box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15), 0 30px 80px rgba(0, 0, 0, 0.45); text-align: center; overflow: hidden; }
  .box::before { content: ''; position: absolute; inset: 0 0 auto; height: 14px; background: var(--stripes); }
  .marquee { position: relative; margin: 6px auto 4px; padding: 16px 12px; border-radius: 22px; background: linear-gradient(160deg, var(--night2), var(--night)); }
  .marquee::after { content: ''; position: absolute; inset: 6px; border-radius: 17px; background: radial-gradient(circle, #fff6c2 0 2.5px, transparent 3px) 0 0 / 16px 16px; -webkit-mask: linear-gradient(#000 0 0) content-box exclude, linear-gradient(#000 0 0); padding: 5px; animation: bulbs 0.8s steps(2) infinite; opacity: 0.9; }
  @keyframes bulbs { 50% { background-position: 8px 8px; } }
  .logo { font-family: var(--display); font-size: 50px; font-weight: 700; color: #fff; line-height: 1; letter-spacing: -0.5px; text-shadow: 0 3px 0 var(--red), 0 6px 18px rgba(0, 0, 0, 0.35); }
  .logo span { color: var(--yellow); }
  .tag { margin: 12px 0 16px; font-size: 15px; color: var(--dim); line-height: 1.5; }
  .box .btn { width: 100%; min-height: 56px; font-size: 19px; margin-top: 8px; }
  .box .big-ic { font-size: 54px; }
  .box h2 { margin: 6px 0; font-family: var(--display); font-size: 26px; color: var(--night); }
  @media (min-width: 760px) {
    #top { flex-direction: row; align-items: center; }
    #top .grp.ctl { margin-inline-start: auto; }
    #hint, #tut { top: calc(var(--top) + 48px); }
    #toasts { top: calc(var(--top) + 96px); }
  }
  @media (min-width: 900px) {
    #sheet { left: auto; right: 14px; transform: none; bottom: 110px; width: 430px; max-height: calc(100vh - 190px); }
    #sheet.wide { max-height: calc(100vh - 190px); }
    @keyframes sin { from { opacity: 0; transform: translateY(18px); } }
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="top">
  <div class="grp">
    <div class="chip" id="c-cash"><span class="ic">💰</span><span class="num" id="cash">₪0</span></div>
    <div class="chip" id="c-guests"><span class="ic">👥</span><span class="num" id="guests">0</span></div>
